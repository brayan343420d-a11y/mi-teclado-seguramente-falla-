name: Compilar teclado Android

# Se ejecuta solo cada vez que subes archivos al repo (por ejemplo el ZIP).
# También puedes lanzarlo a mano desde la pestaña Actions.
on:
  push:
  workflow_dispatch:
    inputs:
      reextraer:
        description: "Volver a descomprimir el ZIP (sobrescribe los archivos del proyecto)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el ZIP dentro del repo
        run: |
          set -e
          FORCE="${{ github.event.inputs.reextraer }}"
          EXISTING="$(find . -name settings.gradle -not -path './.git/*' | head -n 1)"
          if [ -z "$EXISTING" ] || [ "$FORCE" = "true" ]; then
            ZIP="$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)"
            if [ -z "$ZIP" ]; then
              echo "No encontré ningún .zip en el repositorio. Sube WinKeyboard.zip y vuelve a intentar."
              exit 1
            fi
            echo "Descomprimiendo $ZIP"
            unzip -o "$ZIP" -d .
          else
            echo "El proyecto ya está descomprimido, no se vuelve a extraer."
          fi
          SETTINGS="$(find . -name settings.gradle -not -path './.git/*' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "El ZIP no contiene un proyecto Android (falta settings.gradle)."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Guardar los archivos descomprimidos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$PROJECT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Teclado descomprimido automaticamente"
            git push
          else
            echo "Nada nuevo que guardar."
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar el APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Preparar el APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk dist/WinKeyboard.apk

      - name: Guardar el APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: WinKeyboard-apk
          path: dist/WinKeyboard.apk

      - name: Publicar el APK en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Teclado Win11 - compilación ${{ github.run_number }}
          files: dist/WinKeyboard.apk
